    <!-- Script para alternância de abas e contagem de itens -->
    <script>
        // Função para alternar as abas na mesma página
        function openTab(tabId, element) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => {
                content.classList.remove('active');
            });

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(button => {
                button.classList.remove('active');
            });

            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // Função para contar os links automaticamente assim que a página carregar
        window.onload = function() {
            // Conta quantos links (.grid-item) existem dentro de cada aba
            const totalProjetos = document.querySelectorAll('#Projetos .grid-item').length;
            const totalConexoes = document.querySelectorAll('#conexoes .grid-item').length;
            const totalPlataformas = document.querySelectorAll('#plataformas .grid-item').length;

            // Atualiza os números no topo do perfil
            document.getElementById('count-Projetos').innerText = totalProjetos;
            document.getElementById('count-conexoes').innerText = totalConexoes;
            document.getElementById('count-plataformas').innerText = totalPlataformas;
        };
    </script>
